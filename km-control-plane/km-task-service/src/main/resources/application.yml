server:
  # 8083 —— 任务服务。8081 是 MCP 网关, 8082 是 mock 订单服务。
  port: 8083

spring:
  application:
    name: km-task-service

  datasource:
    # ★ 宿主机端口是 3307, 不是 3306 ★
    # 本机装了原生 MySQL 8.4 (Windows 服务 MySQL84) 占着 3306,
    # 所以 docker 里的 MySQL 映射到宿主机 3307。
    # 细节见 docker/docker-compose.yml 里 mysql 段的注释。
    #
    # allowPublicKeyRetrieval=true 是必须的: MySQL 8 默认用
    # caching_sha2_password 认证, 不开 SSL 时要允许客户端取公钥,
    # 否则报 "Public Key Retrieval is not allowed"。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:km_control}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:km}
    password: ${MYSQL_PASSWORD:km_dev_pwd}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    # 数据库是 snake_case, Java 是 camelCase, 靠这个自动映射,
    # 免得每个字段都写一遍 @TableField("agent_task_id")。
    map-underscore-to-camel-case: true
    # 开发期把 SQL 打出来。上线前关掉 —— 它会把参数值一起打到 stdout。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 审计投递 (见 com.km.task.audit.AuditPublisher)
km:
  audit:
    enabled: true
    # docker-compose 里 namesrv 映射到宿主机的 9876
    namesrv-addr: ${ROCKETMQ_NAMESRV:localhost:9876}
    producer-group: km-task-service-audit
    # ★ 改这个名字 = 清空消费位点, 从头重放一遍 ★ 见 AuditProperties.consumerGroup
    # 走环境变量是为了能不改文件就重放一次历史消息:
    #   KM_AUDIT_CONSUMER_GROUP=km-audit-log-consumer-replay mvn spring-boot:run
    consumer-group: ${KM_AUDIT_CONSUMER_GROUP:km-audit-log-consumer}
    # 统一审计 topic —— 四层的事件都进这一个, 消费端只有一个入口
    topic: KM_AUDIT
    send-timeout-ms: 3000
    # 审计可以丢, 所以不重试。理由见 AuditProperties.retryTimes 的注释。
    retry-times: 0
    #
    # 分层采样。现在是开发期, 全采 —— 数据量小的时候采样只会让你查不到东西。
    # 将来 AGENT_RUNTIME 的 LLM_CALL 量上来了, 单独把那层调下去即可, 例如:
    #   default-sample-rate: 1.0
    #   sample-rate:
    #     AGENT_RUNTIME: 0.1
    #
    # 注意: 不管采样率配成多少, status != OK 的事件【永远上报】。
    #
    default-sample-rate: 1.0

    # 审计提交入口 (/api/audit/events) 的信任边界。
    #
    # 这两项虽然挂在 km.audit 下, 但只对任务服务有效 —— 见
    # AuditIngestProperties 的类注释 (为什么没有和 AuditProperties 合并)。
    ingest:
      # Python 侧用 AUDIT_INGEST_TOKEN 配同一个值, 它会以
      # X-KM-Audit-Token 头发过来。空 = 关闭校验, 只应在本地这么做。
      token: ${KM_AUDIT_INGEST_TOKEN:dev-audit-token-change-me}
      # 带了 traceId 却查不到对应执行时: warn = 收下并计入 unverified,
      # strict = 拒收。数据库故障导致的查询失败在两种模式下都放行 ——
      # 审计入口不额外引入"必须查库成功"的同步依赖。
      identity-check: ${KM_AUDIT_IDENTITY_CHECK:warn}

  # 自动重试 (见 com.km.task.retry)
  #
  # ★ 默认关闭 ★ 它会在没人点按钮的时候自己开新链、调 LLM —— 会花钱、
  # 会改任务状态。打开是一个显式决定, 所以要用环境变量:
  #   KM_RETRY_ENABLED=true mvn spring-boot:run
  retry:
    scheduler:
      enabled: ${KM_RETRY_ENABLED:false}
      interval-ms: ${KM_RETRY_INTERVAL_MS:10000}
      batch-size: ${KM_RETRY_BATCH_SIZE:20}
      # 指数退避: 第 n 次失败后等 min(base * 2^n, max) 秒。
      base-backoff-seconds: ${KM_RETRY_BASE_BACKOFF_SECONDS:30}
      max-backoff-seconds: ${KM_RETRY_MAX_BACKOFF_SECONDS:300}
      # 只扫这个租户; 空 = 全部。会花钱的自动行为, 先灰度一个租户再放开。
      tenant: ${KM_RETRY_TENANT:}
    dispatch:
      # Python Agent 运行时地址 (不带 /chat)
      chat-url: ${KM_PYTHON_CHAT_URL:http://localhost:8000}
      connect-timeout-seconds: ${KM_RETRY_CONNECT_TIMEOUT_SECONDS:5}
      # 必须远大于一次 Agent 执行; 读超时不算"没派发成功", 见 RetryDispatcher
      read-timeout-seconds: ${KM_RETRY_READ_TIMEOUT_SECONDS:600}
      concurrency: ${KM_RETRY_CONCURRENCY:2}
      queue-capacity: ${KM_RETRY_QUEUE_CAPACITY:100}

logging:
  level:
    com.km.task: DEBUG
