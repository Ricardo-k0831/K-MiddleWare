brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

namesrvAddr = rocketmq-namesrv:9876

# ============================================================
#  ★ 关键配置, 不明白不要改 ★
#
#  Java 应用跑在宿主机(Docker 外), broker 跑在容器内。
#  broker 默认会把自己容器的内网 IP(172.x.x.x)通告给客户端,
#  宿主机上的客户端拿到这个 IP 后连不上, 表现为:
#     启动正常 -> 发消息时一直超时 / RemotingConnectException
#
#  所以本地开发必须写死成 127.0.0.1, 让宿主机客户端能连回来。
#  将来部署到真实服务器时, 这里改成该服务器的公网/内网 IP。
# ============================================================
brokerIP1 = 127.0.0.1

# 开发期方便: 发消息时 topic 不存在自动创建。
# 生产环境务必设为 false, 改为在控制台预先创建 topic 并规划队列数。
autoCreateTopicEnable = true

# 单机开发内存占用控制
osPageCacheBusyTimeOutMills = 1000
transientStorePoolEnable = false
